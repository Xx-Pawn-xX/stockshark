<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
  >

  <title>Stockshark 🦈</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="app">

    <header>
      <div class="logo">
        <span class="shark">🦈</span>
        <div>
          <h1>STOCKSHARK</h1>
          <p>CHESS ANALYSIS ENGINE</p>
        </div>
      </div>

      <div id="status" class="status">
        Ready
      </div>
    </header>


    <main>

      <section class="board-area">

        <div class="evaluation">
          <div id="evalFill"></div>
          <div id="evalText">0.00</div>
        </div>

        <div id="board" class="board"></div>

      </section>


      <section class="panel">

        <div class="hero">

          <div class="engine-icon">🦈</div>

          <div>
            <div class="label">BEST MOVE</div>
            <div id="bestMove" class="best-move">
              —
            </div>
          </div>

        </div>


        <div class="score-row">

          <div class="stat">
            <span>Evaluation</span>
            <strong id="evaluation">0.00</strong>
          </div>

          <div class="stat">
            <span>Depth</span>
            <strong id="depthDisplay">—</strong>
          </div>

          <div class="stat">
            <span>Nodes</span>
            <strong id="nodesDisplay">0</strong>
          </div>

        </div>


        <div class="section-title">
          PRINCIPAL VARIATION
        </div>

        <div id="pv" class="pv">
          Waiting for analysis...
        </div>


        <div class="controls">

          <label>
            SEARCH DEPTH
            <select id="depth">
              <option value="3">Depth 3 — Fast</option>
              <option value="4">Depth 4</option>
              <option value="5" selected>Depth 5 — Strong</option>
              <option value="6">Depth 6 — Very strong</option>
              <option value="7">Depth 7 — 💀 iPad may think</option>
            </select>
          </label>

        </div>


        <div class="move-input">

          <input
            id="moveInput"
            placeholder="Enter move: e2e4"
            autocomplete="off"
            autocapitalize="off"
          >

          <button id="moveButton">
            PLAY
          </button>

        </div>


        <button id="analyzeButton" class="analyze">
          🦈 ANALYZE POSITION
        </button>


        <div class="actions">

          <button id="undoButton">
            ↶ Undo
          </button>

          <button id="newButton">
            New Game
          </button>

        </div>


        <div class="history-wrap">

          <div class="section-title">
            MOVES
          </div>

          <div id="history" class="history"></div>

        </div>

      </section>

    </main>

  </div>


  <script type="module" src="app.js"></script>

</body>
</html>
